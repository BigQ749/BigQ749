    <text x="440" y="168" fill="#1F4A47" font-size="18">Codex  ·  Grok  ·  OpenCode</text>

    <rect x="808" y="24" width="368" height="172" rx="20" fill="#6B63E8"/>
    <text x="832" y="64" fill="#DDD7FF" font-size="18" letter-spacing="2">03  AGENT SKILL</text>
